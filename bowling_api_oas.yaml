components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    LeagueIdPath:
      { name: leagueId, in: path, required: true, schema: { type: string, format: uuid } }
    TournamentIdPath:
      { name: tournamentId, in: path, required: true, schema: { type: string, format: uuid } }
    TeamIdPath:
      { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
    PlayerIdPath:
      { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
    MatchIdPath:
      { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionNumberPath:
      { name: sessionNumber, in: path, required: true, schema: { type: integer } }
    TournamentIdQuery:
      { name: tournamentId, in: query, required: true, schema: { type: string, format: uuid } }
    TeamIdQuery:
      { name: teamId, in: query, required: true, schema: { type: string, format: uuid } }
    SessionNumberQuery:
      { name: sessionNumber, in: query, required: true, schema: { type: integer } }

  requestBodies:
    TeamScoreCalc:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [teamId]
            properties:
              teamId: { type: string, format: uuid }

  responses:
    NoContent:
      description: Success, no body
    Message:
      description: Success
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
    BadRequest:
      description: Invalid or missing input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials / player identity
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Forbidden }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ── Common ────────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    DecimalString:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: A PostgreSQL NUMERIC or BIGINT value serialized as a string (for example "4.5").
      example: '4.5'
    Health:
      type: object
      properties:
        status: { type: string, example: OK }
        timestamp: { type: string, format: date-time }
        message: { type: string }
        database:
          type: object
          description: Not camelCased.
          properties:
            connected: { type: boolean }
            server_time: { type: string, format: date-time }
            postgres_version: { type: string }
        environment: { type: string }
        version: { type: string }

    # ── Enums ─────────────────────────────────────────────────────────────────
    LeagueStatus: { type: string, enum: [active, inactive, archived] }
    LeagueType: { type: string, enum: [standard, youth, senior] }
    TournamentStatus: { type: string, enum: [draft, active, completed, cancelled] }
    ScheduleType:
      type: string
      enum: [paired, open]
      description: '`paired` = head-to-head matches; `open` = everyone bowls, ranked by pins. `open` requires `rankingMethod: pins`.'
    RankingMethod: { type: string, enum: [points, pins] }
    TeamStatus: { type: string, enum: [active, inactive, suspended] }
    TeamType: { type: string, enum: [standard, solo] }
    RosterRole: { type: string, enum: [captain, regular, substitute] }
    RegistrationStatus: { type: string, enum: [registered, withdrawn] }
    SessionStatus: { type: string, enum: [scheduled, active, completed, cancelled] }
    MatchStatus: { type: string, enum: [scheduled, in_progress, completed, cancelled, postponed] }

    # ── Leagues ───────────────────────────────────────────────────────────────
    League:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        leagueType: { $ref: '#/components/schemas/LeagueType' }
        status: { $ref: '#/components/schemas/LeagueStatus' }
        maxTeamsPerTournament: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LeagueCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        leagueType: { $ref: '#/components/schemas/LeagueType' }
        maxTeamsPerTournament: { type: integer }
    LeagueUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        leagueType: { $ref: '#/components/schemas/LeagueType' }
        status: { $ref: '#/components/schemas/LeagueStatus' }
        maxTeamsPerTournament: { type: integer }
    LeagueAdmin:
      type: object
      properties:
        playerId: { type: string, format: uuid }
        leagueId: { type: string, format: uuid }
        assignedAt: { type: string, format: date-time }
    AssignmentValidation:
      type: object
      properties:
        isValid: { type: boolean }
        violations:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [multiple_teams_in_league, player_ineligible] }
              message: { type: string }
              conflictingTeam: { type: string }
              conflictingTournament: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: expired_ineligibility }
              message: { type: string }
    LeagueViolation:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        leagueId: { type: string, format: uuid }
        playerId: { type: string, format: uuid, nullable: true }
        violationType: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        detectedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        teamName: { type: string }
        leagueName: { type: string }
        playerName: { type: string, nullable: true }

    # ── Tournaments ───────────────────────────────────────────────────────────
    ScoringConfig:
      type: object
      description: Scoring rules as returned by the API (camelCase).
      properties:
        gamesPerSession: { type: integer, example: 3 }
        handicap:
          type: object
          properties:
            baseScore: { type: integer, example: 220 }
            percentage: { type: integer, description: Whole percent, example: 90 }
            floor: { type: integer, example: 0 }
            cap: { type: integer, nullable: true }
        points:
          type: object
          properties:
            perGameWin: { type: number, example: 1 }
            perGameTie: { type: number, example: 0.5 }
            perSeriesWin: { type: number, example: 1 }
            perSeriesTie: { type: number, example: 0.5 }
            bonusCategories: { type: array, items: { type: string }, example: [attendance, uniform] }
            perBonus: { type: number, example: 1 }
    ScoringConfigInput:
      type: object
      description: |
        Scoring rules on create. **Keys are snake_case** (the server reads them before
        camelCase conversion). Omitted values fall back to the defaults shown.
      properties:
        games_per_session: { type: integer, default: 3 }
        handicap:
          type: object
          properties:
            base_score: { type: integer, default: 220 }
            percentage: { type: integer, default: 90, description: Whole percent }
            floor: { type: integer, default: 0 }
            cap: { type: integer, nullable: true, default: null }
        points:
          type: object
          properties:
            per_game_win: { type: number, default: 1 }
            per_game_tie: { type: number, default: 0.5 }
            per_series_win: { type: number, default: 1 }
            per_series_tie: { type: number, default: 0.5 }
            bonus_categories: { type: array, items: { type: string }, default: [] }
            per_bonus: { type: number, default: 1 }
    Tournament:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        maxTeams: { type: integer }
        totalSessions: { type: integer }
        sessionType: { type: string, example: weekly }
        sessionsCompleted: { type: integer, description: Computed from sessions with status `completed` }
        status: { $ref: '#/components/schemas/TournamentStatus' }
        leagueId: { type: string, format: uuid }
        scheduleType: { $ref: '#/components/schemas/ScheduleType' }
        rankingMethod: { $ref: '#/components/schemas/RankingMethod' }
        season: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        lineupSize: { type: integer, description: Players per team per match, example: 3 }
        scoringConfig: { $ref: '#/components/schemas/ScoringConfig' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TournamentCreate:
      type: object
      required: [name, startDate, endDate, maxTeams, totalSessions, sessionType, leagueId]
      properties:
        name: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        maxTeams: { type: integer }
        totalSessions: { type: integer }
        sessionType: { type: string, example: weekly }
        leagueId: { type: string, format: uuid }
        scheduleType: { allOf: [{ $ref: '#/components/schemas/ScheduleType' }], default: paired }
        rankingMethod: { allOf: [{ $ref: '#/components/schemas/RankingMethod' }], default: points }
        season: { type: string }
        year: { type: integer }
        lineupSize: { type: integer, default: 3 }
        scoringConfig: { $ref: '#/components/schemas/ScoringConfigInput' }
        hdcpBase:
          type: integer
          deprecated: true
          description: Legacy; use `scoringConfig.handicap.base_score`.
        hdcpPercentage:
          type: number
          deprecated: true
          description: Legacy fraction (0.9 = 90%); use `scoringConfig.handicap.percentage`.
        gamesPerSession:
          type: integer
          deprecated: true
          description: Legacy; use `scoringConfig.games_per_session`.
    TournamentUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        maxTeams: { type: integer }
        totalSessions: { type: integer }
        sessionType: { type: string }
        status: { $ref: '#/components/schemas/TournamentStatus' }
        sessionsCompleted:
          type: integer
          description: Stored, but responses always return the computed value instead.

    # ── Teams ─────────────────────────────────────────────────────────────────
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        captainName: { type: string, nullable: true }
        captainEmail: { type: string, format: email, nullable: true }
        captainPhone: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TeamStatus' }
        teamType: { $ref: '#/components/schemas/TeamType' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TeamDetail:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          properties:
            roster:
              type: array
              description: Active players across all tournaments
              items:
                type: object
                properties:
                  playerId: { type: string, format: uuid }
                  name: { type: string }
                  email: { type: string, nullable: true }
                  role: { $ref: '#/components/schemas/RosterRole' }
                  isActive: { type: boolean }
                  joinedDate: { type: string, format: date-time }
            tournaments:
              type: array
              items:
                type: object
                properties:
                  tournamentId: { type: string, format: uuid }
                  tournamentName: { type: string }
                  tournamentStatus: { $ref: '#/components/schemas/TournamentStatus' }
                  startDate: { type: string, format: date-time }
                  endDate: { type: string, format: date-time }
                  leagueId: { type: string, format: uuid }
                  leagueName: { type: string }
    TeamCreate:
      type: object
      required: [name, captainName, captainEmail]
      properties:
        name: { type: string }
        captainName: { type: string }
        captainEmail: { type: string, format: email }
        captainPhone: { type: string }
    TeamUpdate:
      type: object
      properties:
        name: { type: string }
        captainName: { type: string }
        captainEmail: { type: string, format: email }
        captainPhone: { type: string }
        status: { type: string, enum: [active, inactive] }

    # ── Players ───────────────────────────────────────────────────────────────
    Player:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        status: { type: string }
        auth0UserId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlayerCreate:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email, description: Required; an Auth0 invitation is sent to it }
