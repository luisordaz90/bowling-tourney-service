openapi: 3.0.3
info:
  title: Bowling Tournament League API
  description: |
    REST API for managing bowling tournament leagues, teams, players,
    match scheduling (round-robin), scoring, and statistics.
  version: 1.0.0
  contact:
    name: Bowling Tournament API

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Tournaments
  - name: Registration
  - name: Schedule
  - name: Scoring
  - name: Standings & Statistics
  - name: Teams
  - name: Players
  - name: Matches
  - name: Sessions
  - name: Leagues
  - name: Player Statistics
  - name: Team Statistics

paths:
  # ── Health ──────────────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  timestamp:
                    type: string
                    format: date-time
                  message:
                    type: string
                    example: Bowling Tournament API is running
                  database:
                    type: object
                    properties:
                      connected:
                        type: boolean
                      serverTime:
                        type: string
                        format: date-time
                      postgresVersion:
                        type: string
                  environment:
                    type: string
                  version:
                    type: string
        '503':
          description: Database connection failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Tournaments ─────────────────────────────────────────────────────────────
  /api/tournaments:
    get:
      tags: [Tournaments]
      summary: List all tournaments
      operationId: listTournaments
      responses:
        '200':
          description: List of tournaments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tournaments]
      summary: Create a tournament
      operationId: createTournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentCreate'
      responses:
        '201':
          description: Tournament created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Tournaments]
      summary: Get tournament by ID
      operationId: getTournament
      responses:
        '200':
          description: Tournament found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Tournaments]
      summary: Update a tournament
      operationId: updateTournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentUpdate'
      responses:
        '200':
          description: Tournament updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tournaments]
      summary: Delete a tournament
      operationId: deleteTournament
      responses:
        '204':
          description: Tournament deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Registration ────────────────────────────────────────────────────────────
  /api/tournaments/{tournamentId}/teams:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Registration]
      summary: List teams registered in a tournament
      operationId: getRegisteredTeams
      responses:
        '200':
          description: Registered teams with details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentTeamListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Registration]
      summary: Register a team to a tournament
      operationId: registerTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId:
                  type: string
                  format: uuid
                seedNumber:
                  type: integer
      responses:
        '201':
          description: Team registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentTeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/TeamIdPath'
    delete:
      tags: [Registration]
      summary: Remove a team from a tournament
      operationId: removeTeamFromTournament
      responses:
        '204':
          description: Team removed
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/teams/{teamId}/players:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/TeamIdPath'
    get:
      tags: [Registration]
      summary: List players on a team roster in a tournament
      operationId: getRegisteredPlayers
      responses:
        '200':
          description: Roster players with details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPlayerListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Registration]
      summary: Add a player to a team roster in a tournament
      operationId: registerPlayerToTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [captain, regular, substitute]
                  default: regular
      responses:
        '201':
          description: Player added to roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPlayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/teams/{teamId}/players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/TeamIdPath'
      - $ref: '#/components/parameters/PlayerIdPath'
    delete:
      tags: [Registration]
      summary: Remove a player from a tournament roster
      operationId: removePlayerFromRoster
      responses:
        '200':
          description: Player removed (soft delete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Schedule ────────────────────────────────────────────────────────────────
  /api/tournaments/{tournamentId}/sessions:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Schedule]
      summary: List sessions for a tournament
      operationId: getTournamentSessions
      responses:
        '200':
          description: Sessions with match counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Schedule]
      summary: Create a session for a tournament
      operationId: createTournamentSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/sessions/{sessionNumber}/matches:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/SessionNumberPath'
    get:
      tags: [Schedule]
      summary: Get matches for a specific session (round)
      operationId: getRoundMatches
      responses:
        '200':
          description: Session matches with validation info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundMatchesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/schedule/round-robin/preview:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Schedule]
      summary: Preview round-robin schedule without saving
      operationId: previewRoundRobin
      responses:
        '200':
          description: Preview of round-robin schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundRobinPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/schedule/round-robin:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    post:
      tags: [Schedule]
      summary: Generate and persist round-robin schedule
      operationId: generateRoundRobin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                  format: date
                daysBetweenSessions:
                  type: integer
                  default: 7
                forceCreate:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Schedule generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundRobinGenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/schedule/summary:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Schedule]
      summary: Get tournament schedule summary
      operationId: getScheduleSummary
      responses:
        '200':
          description: Schedule summary with validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/schedule:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    delete:
      tags: [Schedule]
      summary: Delete tournament schedule (matches and auto-generated sessions)
      operationId: deleteSchedule
      responses:
        '200':
          description: Schedule cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  removedMatches:
                    type: integer
                  removedSessions:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/schedule/validate:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Schedule]
      summary: Validate tournament schedule
      operationId: validateSchedule
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleValidationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/matches:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Schedule]
      summary: List all matches in a tournament
      operationId: getTournamentMatches
      responses:
        '200':
          description: Enriched match list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentMatchListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Schedule]
      summary: Create a single match in a tournament
      operationId: createTournamentMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCreate'
      responses:
        '201':
          description: Match created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Scoring ─────────────────────────────────────────────────────────────────
  /api/tournaments/{tournamentId}/sessions/{sessionNumber}/scores:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/SessionNumberPath'
    get:
      tags: [Scoring]
      summary: Get scores for a session
      operationId: getSessionScores
      responses:
        '200':
          description: Scores grouped by player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionScoreListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Scoring]
      summary: Submit scores for a player in a session
      operationId: submitScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreSubmit'
      responses:
        '201':
          description: Score submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/sessions/{sessionNumber}/scores/{playerId}:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/SessionNumberPath'
      - $ref: '#/components/parameters/PlayerIdPath'
    put:
      tags: [Scoring]
      summary: Update scores for a player in a session
      operationId: updateScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores]
              properties:
                teamId:
                  type: string
                  format: uuid
                  description: Required for paired format
                scores:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 300
      responses:
        '200':
          description: Score updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Scoring]
      summary: Delete scores for a player in a session
      operationId: deleteScore
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  format: uuid
                  description: Required for paired format
      responses:
        '200':
          description: Scores deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Standings & Statistics ──────────────────────────────────────────────────
  /api/tournaments/{tournamentId}/standings:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Standings & Statistics]
      summary: Get tournament standings
      operationId: getStandings
      description: |
        Returns standings based on the tournament ranking_method.
        - `points`: team-based standings from tournament_standings view
        - `pins`: player-based standings aggregated from scores
      responses:
        '200':
          description: Standings list
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PointsStandingsListResponse'
                  - $ref: '#/components/schemas/PinsStandingsListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/statistics:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Standings & Statistics]
      summary: Get tournament aggregate statistics
      operationId: getTournamentStatistics
      responses:
        '200':
          description: Aggregate statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentStatisticsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/players/{playerId}/statistics:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/PlayerIdPath'
    get:
      tags: [Standings & Statistics]
      summary: Get a player's statistics in a tournament
      operationId: getPlayerTournamentStats
      responses:
        '200':
          description: Player tournament statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerTournamentStatsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/teams/{teamId}/statistics:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/TeamIdPath'
    get:
      tags: [Standings & Statistics]
      summary: Get a team's statistics in a tournament
      operationId: getTeamTournamentStats
      responses:
        '200':
          description: Team tournament statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamTournamentStatsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/player-statistics:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Standings & Statistics]
      summary: Get all players' statistics in a tournament
      operationId: getTournamentPlayersStats
      responses:
        '200':
          description: All player statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentPlayersStatsListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tournaments/{tournamentId}/team-statistics:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Standings & Statistics]
      summary: Get all teams' statistics in a tournament
      operationId: getTournamentTeamsStats
      responses:
        '200':
          description: All team statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentTeamsStatsListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Teams ───────────────────────────────────────────────────────────────────
  /api/teams:
    get:
      tags: [Teams]
      summary: List all teams
      operationId: listTeams
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Teams]
      summary: Create a team
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Teams]
      summary: Get team by ID
      operationId: getTeam
      responses:
        '200':
          description: Team found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Teams]
      summary: Update a team
      operationId: updateTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Teams]
      summary: Delete a team
      operationId: deleteTeam
      responses:
        '204':
          description: Team deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Players ─────────────────────────────────────────────────────────────────
  /api/players:
    get:
      tags: [Players]
      summary: List all players
      operationId: listPlayers
      responses:
        '200':
          description: Player list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Players]
      summary: Create a player
      operationId: createPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCreate'
      responses:
        '201':
          description: Player created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/players/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Players]
      summary: Get player by ID
      operationId: getPlayer
      responses:
        '200':
          description: Player found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Players]
      summary: Delete a player
      operationId: deletePlayer
      responses:
        '204':
          description: Player deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/players/{playerId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/PlayerIdPathAlt'
    get:
      tags: [Players]
      summary: Get player dashboard (overview of teams, stats, recent scores)
      operationId: getPlayerDashboard
      responses:
        '200':
          description: Player dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDashboardResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/players/{playerId}/teams:
    parameters:
      - $ref: '#/components/parameters/PlayerIdPathAlt'
    get:
      tags: [Players]
      summary: Get teams a player belongs to
      operationId: getPlayerTeams
      parameters:
        - name: tournamentId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, completed, cancelled]
        - name: includeInactive
          in: query
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
      responses:
        '200':
          description: Player team memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerTeamListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/players/{playerId}/statistics:
    parameters:
      - $ref: '#/components/parameters/PlayerIdPathAlt'
    get:
      tags: [Players]
      summary: Get player statistics across tournaments
      operationId: getPlayerStats
      parameters:
        - name: tournamentId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, completed, cancelled]
      responses:
        '200':
          description: Player statistics per tournament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatsListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/players/{playerId}/league-history:
    parameters:
      - $ref: '#/components/parameters/PlayerIdPathAlt'
    get:
      tags: [Players]
      summary: Get player league history
      operationId: getPlayerLeagueHistory
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
      responses:
        '200':
          description: League history entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueHistoryListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Matches ─────────────────────────────────────────────────────────────────
  /api/matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    get:
      tags: [Matches]
      summary: Get match by ID with points breakdown
      operationId: getMatch
      responses:
        '200':
          description: Match details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/matches/{matchId}/status:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    put:
      tags: [Matches]
      summary: Update match status
      operationId: updateMatchStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [scheduled, in_progress, completed, cancelled, postponed]
      responses:
        '200':
          description: Match status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/matches/{matchId}/player-scores:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    get:
      tags: [Matches]
      summary: Get per-player scores in a match
      operationId: getMatchPlayerScores
      responses:
        '200':
          description: Player scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPlayerScoreListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/matches/{matchId}/team-scores:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    get:
      tags: [Matches]
      summary: Get computed team totals in a match
      operationId: getMatchTeamScores
      responses:
        '200':
          description: Team scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTeamScoreListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Matches]
      summary: Calculate/record team score in a match (legacy alias)
      operationId: addTeamScoreInMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Team score calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamScoreCalcResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/matches/{matchId}/team-scores/calculate:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    post:
      tags: [Matches]
      summary: Calculate team score, trigger match completion and points
      operationId: calculateTeamScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Team score calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamScoreCalcResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Sessions ────────────────────────────────────────────────────────────────
  /api/sessions/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Sessions]
      summary: Update session status
      operationId: updateSessionStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [scheduled, active, completed, cancelled]
      responses:
        '200':
          description: Session status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Leagues ─────────────────────────────────────────────────────────────────
  /api/leagues:
    get:
      tags: [Leagues]
      summary: List leagues
      operationId: listLeagues
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, archived]
        - name: leagueType
          in: query
          schema:
            type: string
      responses:
        '200':
          description: League list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Leagues]
      summary: Create a league
      operationId: createLeague
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueCreate'
      responses:
        '201':
          description: League created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/leagues/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Leagues]
      summary: Get league by ID
      operationId: getLeague
      responses:
        '200':
          description: League found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Leagues]
      summary: Update a league
      operationId: updateLeague
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueUpdate'
      responses:
        '200':
          description: League updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/leagues/validate-assignment:
    post:
      tags: [Leagues]
      summary: Validate player-team assignment for league rules
      operationId: validateAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, teamId, tournamentId]
              properties:
                playerId:
                  type: string
                  format: uuid
                teamId:
                  type: string
                  format: uuid
                tournamentId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/leagues/{leagueId}/violations:
    parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Leagues]
      summary: Get league violations
      operationId: getLeagueViolations
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: violationType
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Violations list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueViolationListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Player Statistics (admin upsert) ────────────────────────────────────────
  /api/player-statistics/{playerId}/{tournamentId}:
    parameters:
      - $ref: '#/components/parameters/PlayerIdPathAlt'
      - $ref: '#/components/parameters/TournamentIdPathAlt'
    put:
      tags: [Player Statistics]
      summary: Upsert player statistics for a tournament
      operationId: upsertPlayerStatistics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerStatisticsUpsert'
      responses:
        '200':
          description: Statistics upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatisticsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Team Statistics (admin upsert) ──────────────────────────────────────────
  /api/team-statistics/{teamId}/{tournamentId}:
    parameters:
      - $ref: '#/components/parameters/TeamIdPathAlt'
      - $ref: '#/components/parameters/TournamentIdPathAlt'
    put:
      tags: [Team Statistics]
      summary: Upsert team statistics for a tournament
      operationId: upsertTeamStatistics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamStatisticsUpsert'
      responses:
        '200':
          description: Statistics upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamStatisticsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

# ══════════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TournamentIdPath:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TournamentIdPathAlt:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamIdPath:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamIdPathAlt:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlayerIdPath:
      name: playerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlayerIdPathAlt:
      name: playerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchIdPath:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionNumberPath:
      name: sessionNumber
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ── Envelope schemas ────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # ── Tournament ──────────────────────────────────────────────────────────
    Tournament:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        maxTeams:
          type: integer
        totalSessions:
          type: integer
        sessionType:
          type: string
        status:
          type: string
          enum: [draft, active, completed, cancelled]
        sessionsCompleted:
          type: integer
        leagueId:
          type: string
          format: uuid
        scheduleType:
          type: string
          enum: [paired, open]
        rankingMethod:
          type: string
          enum: [points, pins]
        hdcpBase:
          type: integer
        hdcpPercentage:
          type: number
        season:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        gamesPerSession:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TournamentCreate:
      type: object
      required: [name, startDate, endDate, maxTeams, totalSessions, sessionType, leagueId]
      properties:
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        maxTeams:
          type: integer
        totalSessions:
          type: integer
        sessionType:
          type: string
        leagueId:
          type: string
          format: uuid
        scheduleType:
          type: string
          enum: [paired, open]
          default: paired
        rankingMethod:
          type: string
          enum: [points, pins]
          default: points
        hdcpBase:
          type: integer
          default: 220
        hdcpPercentage:
          type: number
          default: 0.90
        season:
          type: string
        year:
          type: integer

    TournamentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        maxTeams:
          type: integer
        totalSessions:
          type: integer
        sessionType:
          type: string
        status:
          type: string
          enum: [draft, active, completed, cancelled]
        sessionsCompleted:
          type: integer

    TournamentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Tournament'

    TournamentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tournament'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ── Team ────────────────────────────────────────────────────────────────
    Team:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        captainName:
          type: string
        captainEmail:
          type: string
          format: email
        captainPhone:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive, withdrawn]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeamCreate:
      type: object
      required: [name, captainName, captainEmail]
      properties:
        name:
          type: string
        captainName:
          type: string
        captainEmail:
          type: string
          format: email
        captainPhone:
          type: string

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        captainName:
          type: string
        captainEmail:
          type: string
          format: email
        captainPhone:
          type: string
        status:
          type: string
          enum: [active, inactive, withdrawn]

    TeamResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Team'

    TeamListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ── Player ──────────────────────────────────────────────────────────────
    Player:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        handicap:
          type: integer
        averageScore:
          type: number
        totalGamesPlayed:
          type: integer
        totalPins:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlayerCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        handicap:
          type: integer
          default: 0

    PlayerResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Player'

    PlayerListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ── League ──────────────────────────────────────────────────────────────
    League:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        leagueType:
          type: string
        status:
          type: string
        maxTeamsPerTournament:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeagueCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        leagueType:
          type: string
          default: standard
        maxTeamsPerTournament:
          type: integer

    LeagueUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        leagueType:
          type: string
        status:
          type: string
        maxTeamsPerTournament:
          type: integer

    LeagueResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/League'

    LeagueListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/League'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ── Session (tournament_sessions) ───────────────────────────────────────
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tournamentId:
          type: string
          format: uuid
        sessionNumber:
          type: integer
        sessionName:
          type: string
        sessionDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, active, completed, cancelled]
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    SessionEnriched:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            matchCount:
              type: integer
            completedMatches:
              type: integer
            scheduledMatches:
              type: integer
            inProgressMatches:
              type: integer
            isComplete:
              type: boolean

    SessionCreate:
      type: object
      required: [sessionNumber, sessionDate]
      properties:
        sessionNumber:
          type: integer
        sessionName:
          type: string
        sessionDate:
          type: string
          format: date
        notes:
          type: string

    SessionResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Session'

    SessionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionEnriched'

    # ── Match ───────────────────────────────────────────────────────────────
    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tournamentId:
          type: string
          format: uuid
        homeTeamId:
          type: string
          format: uuid
        awayTeamId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
          nullable: true
        sessionNumber:
          type: integer
          nullable: true
        matchDate:
          type: string
          format: date-time
          nullable: true
        matchName:
          type: string
          nullable: true
        status:
          type: string
          enum: [scheduled, in_progress, completed, cancelled, postponed]
        winnerTeamId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MatchCreate:
      type: object
      required: [homeTeamId, awayTeamId]
      properties:
        homeTeamId:
          type: string
          format: uuid
        awayTeamId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        sessionNumber:
          type: integer
        matchDate:
          type: string
          format: date
        matchName:
          type: string

    MatchResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Match'

    MatchDetailResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/Match'
            - type: object
              properties:
                homeTeamName:
                  type: string
                awayTeamName:
                  type: string
                winnerTeamName:
                  type: string
                  nullable: true
                sessionName:
                  type: string
                  nullable: true
                tournamentName:
                  type: string
                pointsBreakdown:
                  type: object
                  nullable: true
                  properties:
                    homeTeam:
                      $ref: '#/components/schemas/TeamPointsBreakdown'
                    awayTeam:
                      $ref: '#/components/schemas/TeamPointsBreakdown'

    TeamPointsBreakdown:
      type: object
      properties:
        gamePoints:
          type: array
          items:
            type: integer
        seriesPoints:
          type: integer
        totalPoints:
          type: integer

    MatchEnriched:
      allOf:
        - $ref: '#/components/schemas/Match'
        - type: object
          properties:
            homeTeamDetails:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            awayTeamDetails:
              type: object
              properties:
                id:
                  type: string
