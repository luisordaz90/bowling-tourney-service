    PlayerUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    PlayerTeamMembership:
      type: object
      properties:
        id: { type: string, format: uuid, description: Team ID }
        name: { type: string }
        captainName: { type: string, nullable: true }
        captainEmail: { type: string, nullable: true }
        teamStatus: { $ref: '#/components/schemas/TeamStatus' }
        role: { $ref: '#/components/schemas/RosterRole' }
        isActive: { type: boolean }
        joinedDate: { type: string, format: date-time }
        leftDate: { type: string, format: date-time, nullable: true }
        tournamentId: { type: string, format: uuid }
        tournamentName: { type: string }
        tournamentStatus: { $ref: '#/components/schemas/TournamentStatus' }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }

    # ── Me ────────────────────────────────────────────────────────────────────
    MyTeam:
      type: object
      properties:
        id: { type: string, format: uuid, description: Team ID }
        name: { type: string }
        captainName: { type: string, nullable: true }
        teamStatus: { $ref: '#/components/schemas/TeamStatus' }
        role: { $ref: '#/components/schemas/RosterRole' }
        isActive: { type: boolean }
        joinedDate: { type: string, format: date-time }
        leftDate: { type: string, format: date-time, nullable: true }
        tournamentId: { type: string, format: uuid }
        tournamentName: { type: string }
        tournamentStatus: { $ref: '#/components/schemas/TournamentStatus' }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        leagueId: { type: string, format: uuid }
        leagueName: { type: string }
    MyLeague:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        leagueType: { $ref: '#/components/schemas/LeagueType' }
        status: { $ref: '#/components/schemas/LeagueStatus' }
    PlayerDashboard:
      type: object
      properties:
        player: { $ref: '#/components/schemas/Player' }
        currentTeams:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, description: Team ID }
              name: { type: string }
              captainName: { type: string, nullable: true }
              tournamentId: { type: string, format: uuid }
              tournamentName: { type: string }
              tournamentStatus: { $ref: '#/components/schemas/TournamentStatus' }
              role: { $ref: '#/components/schemas/RosterRole' }
              joinedDate: { type: string, format: date-time }
              startDate: { type: string, format: date-time }
        overallStatistics:
          type: object
          properties:
            tournamentsPlayed: { $ref: '#/components/schemas/DecimalString' }
            totalGames: { $ref: '#/components/schemas/DecimalString' }
            totalPins: { $ref: '#/components/schemas/DecimalString' }
            overallAverage: { $ref: '#/components/schemas/DecimalString' }
            careerHighGame: { type: integer }
            careerHighSeries: { type: integer }
            totalMatches: { $ref: '#/components/schemas/DecimalString' }
        recentScores:
          type: array
          description: Last 10 sessions, newest first
          items:
            type: object
            properties:
              sessionId: { type: string, format: uuid }
              tournamentId: { type: string, format: uuid }
              teamId: { type: string, format: uuid, nullable: true }
              matchId: { type: string, format: uuid, nullable: true }
              sessionName: { type: string }
              sessionDate: { type: string, format: date-time }
              tournamentName: { type: string }
              scores: { type: array, items: { type: integer } }
              totalPins: { $ref: '#/components/schemas/DecimalString' }
    PlayerStatisticsEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        teamId: { type: string, format: uuid, nullable: true }
        gamesPlayed: { type: integer }
        totalPins: { type: integer }
        currentAverage: { $ref: '#/components/schemas/DecimalString' }
        currentHandicap: { type: integer }
        highestGame: { type: integer }
        highestSeries: { type: integer }
        matchesPlayed: { type: integer }
        lastUpdated: { type: string, format: date-time }
        tournamentName: { type: string }
        tournamentStatus: { $ref: '#/components/schemas/TournamentStatus' }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        sessionType: { type: string }
    LeagueHistoryEntry:
      type: object
      properties:
        leagueId: { type: string, format: uuid }
        leagueName: { type: string }
        leagueType: { $ref: '#/components/schemas/LeagueType' }
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        role: { $ref: '#/components/schemas/RosterRole' }
        joinedDate: { type: string, format: date-time }
        leftDate: { type: string, format: date-time, nullable: true }
        tournamentId: { type: string, format: uuid }
        tournamentName: { type: string }
        tournamentStatus: { $ref: '#/components/schemas/TournamentStatus' }
        year: { type: integer, nullable: true }
        season: { type: string, nullable: true }

    # ── Registrations ─────────────────────────────────────────────────────────
    TournamentTeam:
      type: object
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        seedNumber: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        totalTournamentScore: { type: integer }
        gamesPlayedInTournament: { type: integer }
        sessionsPlayedInTournament: { type: integer }
        registrationDate: { type: string, format: date-time }
    TournamentTeamWithDetails:
      allOf:
        - $ref: '#/components/schemas/TournamentTeam'
        - type: object
          properties:
            teamDetails:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                captainName: { type: string, nullable: true }
                captainEmail: { type: string, nullable: true }
                captainPhone: { type: string, nullable: true }
                status: { $ref: '#/components/schemas/TeamStatus' }
    TeamPlayer:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/RosterRole' }
        isActive: { type: boolean }
        joinedDate: { type: string, format: date-time }
        leftDate: { type: string, format: date-time, nullable: true }
    TeamPlayerWithDetails:
      allOf:
        - $ref: '#/components/schemas/TeamPlayer'
        - type: object
          properties:
            playerDetails:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                email: { type: string, nullable: true }
                phone: { type: string, nullable: true }

    # ── Sessions ──────────────────────────────────────────────────────────────
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        sessionNumber: { type: integer }
        sessionName: { type: string }
        sessionDate: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/SessionStatus' }
        notes: { type: string, nullable: true }
    SessionEnriched:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            matchCount: { type: integer }
            completedMatches: { type: integer }
            scheduledMatches: { type: integer }
            inProgressMatches: { type: integer }
            isComplete: { type: boolean }
    SessionCreate:
      type: object
      required: [sessionNumber, sessionDate]
      properties:
        sessionNumber: { type: integer }
        sessionName: { type: string, description: 'Defaults to "Session {sessionNumber}"' }
        sessionDate: { type: string, format: date }
        notes: { type: string }

    # ── Schedule ──────────────────────────────────────────────────────────────
    TeamRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    PlannedSession:
      type: object
      properties:
        sessionNumber: { type: integer }
        matches:
          type: array
          items:
            type: object
            properties:
              homeTeam: { $ref: '#/components/schemas/TeamRef' }
              awayTeam: { $ref: '#/components/schemas/TeamRef' }
        teamsPlaying: { type: integer }
        byeTeam: { allOf: [{ $ref: '#/components/schemas/TeamRef' }], nullable: true }
        allTeamsIncluded: { type: boolean }
    ScheduleGenerateOptions:
      type: object
      properties:
        startDate: { type: string, format: date, description: Defaults to the tournament start date }
        daysBetweenSessions: { type: integer, default: 7 }
        overrideTeamOrder: { type: array, items: { type: string, format: uuid }, nullable: true }
        forceCreate: { type: boolean, default: false, description: Create even if validation issues are found }
    RoundRobinPreview:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        totalTeams: { type: integer }
        hasOddTeams: { type: boolean }
        sessionsRequired: { type: integer }
        sessionsAvailable: { type: integer }
        canFitInTournament: { type: boolean }
        totalMatches: { type: integer }
        expectedMatches: { type: integer }
        matchesPerTeam: { type: integer }
        matchesPerSession: { type: integer }
        teamsPerSession: { type: integer }
        schedule: { type: array, items: { $ref: '#/components/schemas/PlannedSession' } }
        validationIssues: { type: array, items: { type: object } }
        isValidSchedule: { type: boolean }
        teams:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              seedNumber: { type: integer, nullable: true }
        byeRotation: { type: object, nullable: true }
    RoundRobinGenerateResult:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        totalMatchesCreated: { type: integer }
        totalSessionsCreated: { type: integer }
        totalTeams: { type: integer }
        sessionsRequired: { type: integer }
        validationIssues: { type: array, items: { type: object } }
        wasForced: { type: boolean }
        schedule: { type: array, items: { $ref: '#/components/schemas/PlannedSession' } }
        createdMatches: { type: array, items: { $ref: '#/components/schemas/Match' } }
        createdSessions: { type: array, items: { $ref: '#/components/schemas/Session' } }
    ScheduleSummary:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        totalTeams: { type: integer }
        totalSessions: { type: integer }
        expectedSessions: { type: integer }
        hasCorrectSessions: { type: boolean }
        matchStats:
          type: object
          properties:
            total: { type: integer }
            scheduled: { type: integer }
            inProgress: { type: integer }
            completed: { type: integer }
            cancelled: { type: integer }
            postponed: { type: integer }
        expectedMatches: { type: integer }
        isCompleteRoundRobin: { type: boolean }
        sessionAnalysis:
          type: array
          items:
            type: object
            properties:
              session: { type: integer }
              matchCount: { type: integer }
              teamsPlaying: { type: integer }
              expectedTeamsPerSession: { type: integer }
              hasConflicts: { type: boolean }
              conflicts: { type: array, items: { type: object } }
              isValidSession: { type: boolean }
              matches: { type: array, items: { type: object } }
        hasScheduleConflicts: { type: boolean }
        overallValidation:
          type: object
          properties:
            allTeamsPlayingPerSession: { type: boolean }
            noTeamConflicts: { type: boolean }
            completeRoundRobin: { type: boolean }
        sessions: { type: array, items: { $ref: '#/components/schemas/Session' } }
    ScheduleValidation:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        totalTeams: { type: integer }
        totalMatches: { type: integer }
        issues:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              message: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              message: { type: string }
              expected: { type: integer }
              actual: { type: integer }
        isValid: { type: boolean }
    ScheduleDeleteResult:
      type: object
      properties:
        message: { type: string }
        removedMatches: { type: integer }
        removedSessions: { type: integer }

    # ── Matches ───────────────────────────────────────────────────────────────
    Match:
      type: object
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        homeTeamId: { type: string, format: uuid }
        awayTeamId: { type: string, format: uuid }
        winnerTeamId: { type: string, format: uuid, nullable: true }
        sessionId: { type: string, format: uuid, nullable: true }
        sessionNumber: { type: integer, nullable: true }
        matchDate: { type: string, format: date-time, nullable: true }
        matchName: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/MatchStatus' }
        handicaps: { type: object, description: Per-player handicaps frozen for this match }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MatchCreate:
      type: object
      required: [homeTeamId, awayTeamId]
      properties:
        homeTeamId: { type: string, format: uuid }
        awayTeamId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        sessionNumber: { type: integer }
        matchDate: { type: string, format: date }
        matchName: { type: string }
    MatchWithTeams:
      allOf:
        - $ref: '#/components/schemas/Match'
        - type: object
          properties:
            homeTeamName: { type: string }
            awayTeamName: { type: string }
            winnerTeamName: { type: string, nullable: true }
            homeTeamDetails: { $ref: '#/components/schemas/TeamRef' }
            awayTeamDetails: { $ref: '#/components/schemas/TeamRef' }
    MatchListItem:
      allOf:
        - $ref: '#/components/schemas/MatchWithTeams'
        - type: object
          properties:
            sessionName: { type: string, nullable: true }
            sessionDate: { type: string, format: date-time, nullable: true }
            winnerTeamDetails: { allOf: [{ $ref: '#/components/schemas/TeamRef' }], nullable: true }
            sessionDetails:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                date: { type: string, format: date-time }
    RoundMatches:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        session: { type: integer, description: Session number }
        matchCount: { type: integer }
        teamsPlaying: { type: integer }
        expectedTeamsPlaying: { type: integer }
        allTeamsPlaying: { type: boolean }
        byeTeam: { allOf: [{ $ref: '#/components/schemas/TeamRef' }], nullable: true }
        hasConflicts: { type: boolean }
        conflicts: { type: array, items: { type: object } }
        isValidSession: { type: boolean }
        matches:
          type: array
          description: Does not include `pointsBreakdown`; use `GET /api/matches/{matchId}` for points.
          items: { $ref: '#/components/schemas/MatchWithTeams' }
    TeamPoints:
      type: object
      properties:
        gamePoints: { type: array, items: { type: number }, description: Points per game (0, 0.5, or 1) }
        seriesPoints: { $ref: '#/components/schemas/DecimalString' }
        totalPoints: { $ref: '#/components/schemas/DecimalString' }
    MatchDetail:
      allOf:
        - $ref: '#/components/schemas/Match'
        - type: object
          properties:
            homeTeamName: { type: string }
            awayTeamName: { type: string }
            winnerTeamName: { type: string, nullable: true }
            sessionName: { type: string, nullable: true }
            tournamentName: { type: string }
            homeTotalPoints: { allOf: [{ $ref: '#/components/schemas/DecimalString' }], nullable: true }
            awayTotalPoints: { allOf: [{ $ref: '#/components/schemas/DecimalString' }], nullable: true }
            homeGamePoints: { type: array, items: { type: number }, nullable: true }
            awayGamePoints: { type: array, items: { type: number }, nullable: true }
            homeSeriesPoints: { allOf: [{ $ref: '#/components/schemas/DecimalString' }], nullable: true }
            awaySeriesPoints: { allOf: [{ $ref: '#/components/schemas/DecimalString' }], nullable: true }
            pointsBreakdown:
              type: object
              nullable: true
              description: '`null` until match points have been calculated'
              properties:
                homeTeam: { $ref: '#/components/schemas/TeamPoints' }
                awayTeam: { $ref: '#/components/schemas/TeamPoints' }
    MatchPlayerScore:
      type: object
      properties:
        playerId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        playerName: { type: string }
        teamName: { type: string }
        scores:
          type: array
          items:
            type: object
            properties:
              gameNumber: { type: integer }
              score: { type: integer }
        handicapApplied: { type: integer }
        createdAt: { type: string, format: date-time }
    MatchTeamScore:
      type: object
      properties:
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        totalTeamScore: { $ref: '#/components/schemas/DecimalString' }
        totalHandicap: { $ref: '#/components/schemas/DecimalString' }
        teamAverage: { $ref: '#/components/schemas/DecimalString' }
        gamesPlayed: { $ref: '#/components/schemas/DecimalString' }
        recordedAt: { type: string, format: date-time }
    TeamScoreCalcResult:
      type: object
      properties:
        matchId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        totalTeamScore: { type: integer }
        totalHandicap: { type: integer }
        teamAverage: { type: number }
        gamesPlayed: { type: integer }
        matchCompleted: { type: boolean }
        message: { type: string }

    # ── Scores ────────────────────────────────────────────────────────────────
    ScoreSubmit:
      type: object
      required: [playerId, scores]
      properties:
        playerId: { type: string, format: uuid }
        teamId: { type: string, format: uuid, description: Required for paired tournaments }
        scores:
          type: array
          description: Exactly `gamesPerSession` values
          items: { type: integer, minimum: 0, maximum: 300 }
    ScoreSubmitResult:
      type: object
      properties:
        id: { type: string, format: uuid, description: ID of the game-1 score row }
        tournamentId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        sessionNumber: { type: integer }
        matchId: { type: string, format: uuid, nullable: true, description: '`null` in open tournaments' }
        playerId: { type: string, format: uuid }
        teamId: { type: string, format: uuid, nullable: true }
        scores: { type: array, items: { type: integer } }
        handicapApplied: { type: integer, description: Per-game handicap }
        totalPins: { type: integer, description: Scratch pins plus handicap for every game }
        sessionAverage: { type: number }
        matchCompleted: { type: boolean, description: Paired tournaments only }
        recordedAt: { type: string, format: date-time }
    ScoreUpdateResult:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        sessionNumber: { type: integer }
        matchId: { type: string, format: uuid, nullable: true }
        playerId: { type: string, format: uuid }
        teamId: { type: string, format: uuid, description: Paired tournaments only }
        scores: { type: array, items: { type: integer } }
        totalPins: { type: integer, description: Scratch pins (no handicap) }
        sessionAverage: { type: number }
        recordedAt: { type: string, format: date-time, description: Open tournaments only }
    PairedSessionScore:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        sessionNumber: { type: integer }
        matchId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        playerName: { type: string }
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        scores: { type: array, items: { type: integer } }
        handicapApplied: { type: integer }
        recordedAt: { type: string, format: date-time }
    OpenSessionScore:
      type: object
      properties:
        tournamentId: { type: string, format: uuid }
        sessionNumber: { type: integer }
        playerId: { type: string, format: uuid }
        playerName: { type: string }
        teamId: { type: string, format: uuid, nullable: true }
        teamName: { type: string, nullable: true }
        scores: { type: array, items: { type: integer } }
        handicapApplied: { type: integer }
        totalPins: { type: integer, description: Including handicap }
        sessionAverage: { type: number }
        recordedAt: { type: string, format: date-time }

    # ── Standings & Statistics ────────────────────────────────────────────────
    PointsStanding:
      type: object
      properties:
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        captainName: { type: string, nullable: true }
        totalScore: { type: integer }
        gamesPlayed: { type: integer }
        averageScore: { type: number }
        matchesPlayed: { type: integer }
        matchesWon: { type: integer }
        matchesLost: { type: integer }
        winPercentage: { type: number }
        totalPoints: { type: integer, description: Primary ranking key }
        pointsPercentage: { type: number }
        maxPossiblePoints: { type: integer }
        seedNumber: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        rank: { type: integer }
    PinsStanding:
      type: object
      properties:
        playerId: { type: string, format: uuid }
        playerName: { type: string }
        teamId: { type: string, format: uuid, nullable: true }
        teamName: { type: string, nullable: true }
        sessionsPlayed: { type: integer }
        totalPins: { type: integer, description: Including handicap; primary ranking key }
        tournamentAverage: { type: number }
        rank: { type: integer }
    TournamentStatistics:
      type: object
      properties:
        totalTeams: { type: integer }
        totalPlayers: { type: integer }
        totalGames: { type: integer }
        highestGame: { type: integer }
        highestSeries: { type: integer }
        averageScore: { type: integer }
        sessionsCompleted: { type: integer }
        totalSessions: { type: integer }
        totalMatches: { type: integer }
        completedMatches: { type: integer }
        scheduledMatches: { type: integer }
        pointSystem:
          type: object
          properties:
            totalPointsAwarded: { type: integer }
            maxPossiblePoints: { type: integer }
            averagePointsPerTeam: { type: number }
            averagePointsPercentage: { type: number }
    PlayerTournamentStats:
      type: object
      properties:
        playerId: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        gamesPlayed: { type: integer }
        totalPins: { type: integer }
        currentAverage: { type: number }
        highestGame: { type: integer }
        highestSeries: { type: integer }
        matchesPlayed: { type: integer }
        matchesContributedToWin: { type: integer }
        currentHandicap: { type: integer }
    TeamTournamentStats:
      type: object
      properties:
        teamId: { type: string, format: uuid }
        tournamentId: { type: string, format: uuid }
        totalMatchesPlayed: { type: integer }
        matchesWon: { type: integer }
        matchesLost: { type: integer }
        totalTeamScore: { type: integer }
        teamAverage: { type: number }
        totalPoints: { type: integer }
        pointsPercentage: { type: number }
        maxPossiblePoints: { type: integer }
        rankPosition: { type: integer, nullable: true }
        pointsBreakdown:
          type: object
          properties:
            totalGamePointsWon: { type: integer }
            seriesPointsWon: { type: integer }
    TournamentPlayerStats:
      type: object
      properties:
        playerId: { type: string, format: uuid }
        playerName: { type: string }
        teamId: { type: string, format: uuid, nullable: true }
        tournamentId: { type: string, format: uuid }
        gamesPlayed: { type: integer }
        totalPins: { type: integer }
        currentAverage: { type: number }
        highestGame: { type: integer }
        highestSeries: { type: integer }
        matchesPlayed: { type: integer }
        matchesContributedToWin: { type: integer }
    TournamentTeamStats:
      type: object
      properties:
        teamId: { type: string, format: uuid }
