openapi: 3.0.3
info:
  title: Bowling Tournament League API
  version: 2.0.0
  description: |
    REST API for managing bowling leagues, tournaments, teams, players,
    round-robin scheduling, scoring, and statistics.

    ## Conventions
    - Responses are **raw JSON bodies** — there is no `{ data }` envelope and no pagination.
    - Errors are always `{ "error": "<message>" }`.
    - `204` responses have no body.
    - Keys are camelCase in requests and responses. Exception: the `scoringConfig`
      object on tournament **create** is read with snake_case keys (see `ScoringConfigInput`).
    - PostgreSQL `NUMERIC`/`BIGINT` values that are not explicitly converted by the
      server are serialized as strings (see `DecimalString`).

    ## Routes
    Flat routes (`/api/sessions`, `/api/schedule`, `/api/scores`, `/api/matches`,
    `/api/standings`, `/api/statistics`, `/api/registrations`, `/api/me`) are the
    supported surface. Nested `/api/tournaments/{tournamentId}/...` routes are
    deprecated and send `Deprecation: true` plus a `Link: <successor>; rel="successor-version"` header.

    ## Auth
    All `/api` routes except `/api/health` require an Auth0 bearer JWT. The caller's
    role (`superadmin`, `league_admin`, `player`) comes from the token. Operations
    that check a permission return `403 { "error": "Forbidden" }` when it is denied.
servers:
  - url: http://localhost:3000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Leagues
  - name: Tournaments
  - name: Teams
  - name: Players
  - name: Me
    description: Endpoints scoped to the authenticated player
  - name: Registrations
  - name: Sessions
  - name: Schedule
  - name: Matches
  - name: Scores
  - name: Standings & Statistics
  - name: Deprecated
    description: Nested legacy routes kept until the frontend migrates off them

paths:
  # ── Health ──────────────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: API and database are reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '500':
          $ref: '#/components/responses/ServerError'

  # ── Leagues ─────────────────────────────────────────────────────────────────
  /api/leagues:
    get:
      tags: [Leagues]
      summary: List leagues
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/LeagueStatus' } }
        - { name: leagueType, in: query, schema: { $ref: '#/components/schemas/LeagueType' } }
      responses:
        '200':
          description: Leagues
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/League' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Leagues]
      summary: Create a league
      description: 'Permission: `league:create` (superadmin).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeagueCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/League' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leagues/validate-assignment:
    post:
      tags: [Leagues]
      summary: Check whether a player can join a team under league rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, teamId, tournamentId]
              properties:
                playerId: { type: string, format: uuid }
                teamId: { type: string, format: uuid }
                tournamentId: { type: string, format: uuid }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentValidation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leagues/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Leagues]
      summary: Get a league
      responses:
        '200':
          description: League
          content:
            application/json:
              schema: { $ref: '#/components/schemas/League' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Leagues]
      summary: Update a league
      description: 'Permission: `league:update` (superadmin, or league_admin of this league).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeagueUpdate' }
      responses:
        '200':
          description: Updated league
          content:
            application/json:
              schema: { $ref: '#/components/schemas/League' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leagues/{leagueId}/admins:
    parameters:
      - $ref: '#/components/parameters/LeagueIdPath'
    post:
      tags: [Leagues]
      summary: Assign a league admin
      description: 'Permission: `league:admin:manage` (superadmin).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string, format: uuid }
      responses:
        '201':
          description: Assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeagueAdmin' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Player is already an admin for this league
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leagues/{leagueId}/admins/{playerId}:
    parameters:
      - $ref: '#/components/parameters/LeagueIdPath'
      - $ref: '#/components/parameters/PlayerIdPath'
    delete:
      tags: [Leagues]
      summary: Remove a league admin
      description: 'Permission: `league:admin:manage` (superadmin).'
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/leagues/{leagueId}/violations:
    parameters:
      - $ref: '#/components/parameters/LeagueIdPath'
    get:
      tags: [Leagues]
      summary: List league rule violations
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, dismissed] } }
        - { name: violationType, in: query, schema: { type: string } }
      responses:
        '200':
          description: Violations, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeagueViolation' } }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Tournaments ─────────────────────────────────────────────────────────────
  /api/tournaments:
    get:
      tags: [Tournaments]
      summary: List tournaments
      parameters:
        - name: leagueId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tournaments, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Tournament' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Tournaments]
      summary: Create a tournament
      description: 'Permission: `tournament:create` (superadmin, or league_admin of `leagueId`).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/tournaments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Tournaments]
      summary: Get a tournament
      responses:
        '200':
          description: Tournament
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Tournaments]
      summary: Update a tournament
      description: |
        Permission: `tournament:update`. Only the fields in `TournamentUpdate` can be changed;
        `scoringConfig`, `scheduleType`, `rankingMethod`, and `leagueId` are fixed at creation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentUpdate' }
      responses:
        '200':
          description: Updated tournament
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Tournaments]
      summary: Delete a tournament (cascades)
      description: 'Permission: `tournament:delete`.'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Teams ───────────────────────────────────────────────────────────────────
  /api/teams:
    get:
      tags: [Teams]
      summary: List teams
      responses:
        '200':
          description: Teams ordered by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Team' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamIdPath'
    get:
      tags: [Teams]
      summary: Get a team with its active roster and tournament enrollments
      responses:
        '200':
          description: Team detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Teams]
      summary: Update a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamUpdate' }
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Teams]
      summary: Delete a team
      description: Fails with 400 while the team is registered in any tournament.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Players ─────────────────────────────────────────────────────────────────
  /api/players:
    get:
      tags: [Players]
      summary: List players
      responses:
        '200':
          description: Players ordered by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Player' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Players]
      summary: Create a player and send an Auth0 invitation
      description: 'Permission: `player:create` (superadmin, league_admin).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/players/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Players]
      summary: Get a player
      responses:
        '200':
          description: Player
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Players]
      summary: Update a player's profile
      description: 'Permission: `player:update` (superadmin, league_admin, or the player themself).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerUpdate' }
      responses:
        '200':
          description: Updated player
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Players]
      summary: Delete a player
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/players/{playerId}/teams:
    parameters:
      - $ref: '#/components/parameters/PlayerIdPath'
    get:
      tags: [Players]
      summary: List a player's team memberships
      description: Use this to view another player's teams; `/api/me/teams` only covers the caller.
      parameters:
        - { name: tournamentId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, description: Tournament status, schema: { $ref: '#/components/schemas/TournamentStatus' } }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlayerTeamMembership' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Me ──────────────────────────────────────────────────────────────────────
  /api/me/teams:
    get:
      tags: [Me]
      summary: My active team memberships
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MyTeam' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/me/leagues:
    get:
      tags: [Me]
      summary: Leagues I currently play in
      responses:
        '200':
          description: Leagues
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MyLeague' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/me/dashboard:
    get:
      tags: [Me]
      summary: My dashboard (profile, teams, career stats, last 10 sessions)
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/me/statistics:
    get:
      tags: [Me]
      summary: My statistics per tournament
      parameters:
        - { name: tournamentId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, description: Tournament status, schema: { $ref: '#/components/schemas/TournamentStatus' } }
      responses:
        '200':
          description: One entry per tournament
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlayerStatisticsEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/me/league-history:
    get:
      tags: [Me]
      summary: My league participation history
      parameters:
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: History entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeagueHistoryEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Registrations ───────────────────────────────────────────────────────────
  /api/registrations/teams:
    get:
      tags: [Registrations]
      summary: List teams registered in a tournament
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Registrations ordered by seed, then name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TournamentTeamWithDetails' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Registrations]
      summary: Register a team in a tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tournamentId, teamId]
              properties:
                tournamentId: { type: string, format: uuid }
                teamId: { type: string, format: uuid }
                seedNumber: { type: integer }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TournamentTeam' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/registrations/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamIdPath'
      - $ref: '#/components/parameters/TournamentIdQuery'
    delete:
      tags: [Registrations]
      summary: Unregister a team from a tournament
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/registrations/players:
    get:
      tags: [Registrations]
      summary: List a team's active roster in a tournament
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
        - $ref: '#/components/parameters/TeamIdQuery'
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TeamPlayerWithDetails' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Registrations]
      summary: Add a player to a team's roster in a tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tournamentId, teamId, playerId]
              properties:
                tournamentId: { type: string, format: uuid }
                teamId: { type: string, format: uuid }
                playerId: { type: string, format: uuid }
                role: { $ref: '#/components/schemas/RosterRole' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPlayer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/registrations/players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/PlayerIdPath'
      - $ref: '#/components/parameters/TournamentIdQuery'
      - $ref: '#/components/parameters/TeamIdQuery'
    delete:
      tags: [Registrations]
      summary: Remove a player from a team's roster
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Sessions ────────────────────────────────────────────────────────────────
  /api/sessions:
    get:
      tags: [Sessions]
      summary: List a tournament's sessions with match counts
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Sessions ordered by number
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SessionEnriched' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Sessions]
      summary: Create a session
      description: 'Permission: `session:create`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [tournamentId]
                  properties:
                    tournamentId: { type: string, format: uuid }
                - $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/sessions/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Sessions]
      summary: Update a session's status
      description: 'Permission: `session:update`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/SessionStatus' }
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Schedule ────────────────────────────────────────────────────────────────
  /api/schedule:
    delete:
      tags: [Schedule]
      summary: Delete a tournament's matches and auto-generated sessions
      description: 'Permission: `schedule:delete`.'
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleDeleteResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/schedule/preview:
    get:
      tags: [Schedule]
      summary: Preview a round-robin schedule without saving it
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundRobinPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/schedule/generate:
    post:
      tags: [Schedule]
      summary: Generate and save a round-robin schedule
      description: 'Permission: `schedule:generate`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [tournamentId]
                  properties:
                    tournamentId: { type: string, format: uuid }
                - $ref: '#/components/schemas/ScheduleGenerateOptions'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundRobinGenerateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/schedule/summary:
    get:
      tags: [Schedule]
      summary: Schedule summary and round-robin completeness
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/schedule/validate:
    get:
      tags: [Schedule]
      summary: Validate a tournament's schedule
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleValidation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Matches ─────────────────────────────────────────────────────────────────
  /api/matches:
    get:
      tags: [Matches]
      summary: List matches
      description: |
        The response shape depends on `sessionNumber`:
        - without it: an array of every match in the tournament (`MatchListItem[]`)
        - with it: a single round object with session validation (`RoundMatches`)
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
        - name: sessionNumber
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/MatchListItem' }
                  - $ref: '#/components/schemas/RoundMatches'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Matches]
      summary: Create a single match
      description: 'Permission: `match:create`. Both teams must be registered in the tournament.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [tournamentId]
                  properties:
                    tournamentId: { type: string, format: uuid }
                - $ref: '#/components/schemas/MatchCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    get:
      tags: [Matches]
      summary: Get a match with team names and points breakdown
      responses:
        '200':
          description: Match detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/matches/{matchId}/status:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    put:
      tags: [Matches]
      summary: Update a match's status
      description: 'Permission: `match:update`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/MatchStatus' }
      responses:
        '200':
          description: Updated match
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/matches/{matchId}/player-scores:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    get:
      tags: [Matches]
      summary: Per-player game scores in a match
      responses:
        '200':
          description: One entry per player
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MatchPlayerScore' } }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/matches/{matchId}/team-scores:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    get:
      tags: [Matches]
      summary: Team totals in a match (computed from scores)
      responses:
        '200':
          description: One entry per team
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MatchTeamScore' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Matches, Deprecated]
      summary: Record a team score (alias of /team-scores/calculate)
      deprecated: true
      description: Match completion and points are calculated automatically when scores are submitted to `POST /api/scores`.
      requestBody:
        $ref: '#/components/requestBodies/TeamScoreCalc'
      responses:
        '201':
          description: Team totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamScoreCalcResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/matches/{matchId}/team-scores/calculate:
    parameters:
      - $ref: '#/components/parameters/MatchIdPath'
    post:
      tags: [Matches, Deprecated]
      summary: Compute team totals and try to complete the match
      deprecated: true
      description: Match completion and points are calculated automatically when scores are submitted to `POST /api/scores`.
      requestBody:
        $ref: '#/components/requestBodies/TeamScoreCalc'
      responses:
        '201':
          description: Team totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamScoreCalcResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Scores ──────────────────────────────────────────────────────────────────
  /api/scores:
    get:
      tags: [Scores]
      summary: List scores for a session
      description: |
        Shape depends on the tournament's `scheduleType`:
        - `paired`: `PairedSessionScore[]` (grouped per match, no totals)
        - `open`: `OpenSessionScore[]` (with totals, ordered by total pins)
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
        - $ref: '#/components/parameters/SessionNumberQuery'
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/PairedSessionScore' }
                  - type: array
                    items: { $ref: '#/components/schemas/OpenSessionScore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Scores]
      summary: Submit a player's games for a session
      description: |
        Permission: `score:submit` (superadmin, league_admin, or the team's captain).
        `scores` must contain exactly `scoringConfig.gamesPerSession` values between 0 and 300.
        `teamId` is required for `paired` tournaments. In paired tournaments the match
        completes, and points are calculated, once both line-ups have submitted every game.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [tournamentId, sessionNumber]
                  properties:
                    tournamentId: { type: string, format: uuid }
                    sessionNumber: { type: integer }
                - $ref: '#/components/schemas/ScoreSubmit'
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreSubmitResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/scores/{playerId}:
    parameters:
      - $ref: '#/components/parameters/PlayerIdPath'
    put:
      tags: [Scores]
      summary: Replace a player's games for a session
      description: 'Permission: `score:update`. `tournamentId` and `sessionNumber` can be sent in the body or the query string.'
      parameters:
        - { name: tournamentId, in: query, schema: { type: string, format: uuid } }
        - { name: sessionNumber, in: query, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores]
              properties:
                tournamentId: { type: string, format: uuid }
                sessionNumber: { type: integer }
                teamId: { type: string, format: uuid, description: Required for paired tournaments }
                scores: { type: array, items: { type: integer, minimum: 0, maximum: 300 } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreUpdateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Scores]
      summary: Delete a player's games for a session
      description: |
        Permission: `score:delete`. `tournamentId` and `sessionNumber` can be sent in the body
        or the query string; `teamId` is read from the body only.
      parameters:
        - { name: tournamentId, in: query, schema: { type: string, format: uuid } }
        - { name: sessionNumber, in: query, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tournamentId: { type: string, format: uuid }
                sessionNumber: { type: integer }
                teamId: { type: string, format: uuid, description: Required for paired tournaments }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Standings & Statistics ──────────────────────────────────────────────────
  /api/standings:
    get:
      tags: [Standings & Statistics]
      summary: Tournament standings
      description: |
        Shape depends on the tournament's `rankingMethod`:
        - `points`: team standings (`PointsStanding[]`)
        - `pins`: player standings by total pins with handicap (`PinsStanding[]`)
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Standings ordered by rank
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/PointsStanding' }
                  - type: array
                    items: { $ref: '#/components/schemas/PinsStanding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/statistics:
    get:
      tags: [Standings & Statistics]
      summary: Tournament aggregate statistics
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TournamentStatistics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/statistics/players:
    get:
      tags: [Standings & Statistics]
      summary: Every player's statistics in a tournament
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Ordered by average, then total pins
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TournamentPlayerStats' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/statistics/players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/PlayerIdPath'
    get:
      tags: [Standings & Statistics]
      summary: One player's statistics in a tournament
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerTournamentStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Standings & Statistics]
      summary: Upsert a player's statistics row
      description: 'Permission: `statistics:update`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [tournamentId]
                  properties:
                    tournamentId: { type: string, format: uuid }
                - $ref: '#/components/schemas/PlayerStatisticsUpsert'
      responses:
        '200':
          description: Stored row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerStatisticsRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/statistics/teams:
    get:
      tags: [Standings & Statistics]
      summary: Every team's statistics in a tournament
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Ordered by rank
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TournamentTeamStats' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/statistics/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamIdPath'
    get:
      tags: [Standings & Statistics]
      summary: One team's statistics in a tournament
      parameters:
        - $ref: '#/components/parameters/TournamentIdQuery'
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamTournamentStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Standings & Statistics]
      summary: Upsert a team's statistics row
      description: 'Permission: `statistics:update`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [tournamentId]
                  properties:
                    tournamentId: { type: string, format: uuid }
                - $ref: '#/components/schemas/TeamStatisticsUpsert'
      responses:
        '200':
          description: Stored row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamStatisticsRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Nested tournament routes ────────────────────────────────────────────────
  /api/tournaments/{tournamentId}/matches:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Matches]
      summary: List every match in a tournament
      description: Same handler as `GET /api/matches?tournamentId=`.
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MatchListItem' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Matches]
      summary: Create a single match
      description: Same handler as `POST /api/matches`, but without a permission check.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ── Deprecated nested routes ────────────────────────────────────────────────
  /api/tournaments/{tournamentId}/teams:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use GET /api/registrations/teams'
      responses:
        '200':
          description: Registrations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TournamentTeamWithDetails' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use POST /api/registrations/teams'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId: { type: string, format: uuid }
                seedNumber: { type: integer }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TournamentTeam' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/tournaments/{tournamentId}/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/TeamIdPath'
    delete:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use DELETE /api/registrations/teams/{teamId}'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/tournaments/{tournamentId}/teams/{teamId}/players:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/TeamIdPath'
    get:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use GET /api/registrations/players'
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TeamPlayerWithDetails' } }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use POST /api/registrations/players'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId]
              properties:
                playerId: { type: string, format: uuid }
                role: { $ref: '#/components/schemas/RosterRole' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPlayer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/tournaments/{tournamentId}/teams/{teamId}/players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/TeamIdPath'
      - $ref: '#/components/parameters/PlayerIdPath'
    delete:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use DELETE /api/registrations/players/{playerId}'
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/tournaments/{tournamentId}/sessions:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
    get:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use GET /api/sessions'
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SessionEnriched' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use POST /api/sessions'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/tournaments/{tournamentId}/sessions/{sessionNumber}/matches:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/SessionNumberPath'
    get:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use GET /api/matches?tournamentId=&sessionNumber='
      responses:
        '200':
          description: Round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundMatches' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/tournaments/{tournamentId}/sessions/{sessionNumber}/scores:
    parameters:
      - $ref: '#/components/parameters/TournamentIdPath'
      - $ref: '#/components/parameters/SessionNumberPath'
    get:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use GET /api/scores'
      responses:
        '200':
          description: Scores
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/PairedSessionScore' }
                  - type: array
                    items: { $ref: '#/components/schemas/OpenSessionScore' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Deprecated]
      deprecated: true
      summary: 'Use POST /api/scores'
      description: 'Permission: `score:submit`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreSubmit' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoreSubmitResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /api/tournaments/{tournamentId}/sessions/{sessionNumber}/scores/{playerId}:
    parameters:
